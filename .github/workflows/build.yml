name: Build SlipNet APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    # هذا السطر يخبر GitHub أن يعمل داخل مجلد SlipNet-main
    defaults:
      run:
        working-directory: SlipNet-main

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK & NDK
      uses: android-actions/setup-android@v4

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 9.3.1
        cache-disabled: true

    - name: Setup OpenSSL for Android
      run: gradle setupOpenSsl

    - name: Build APK (Full Debug)
      run: gradle assembleFullDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SlipNet-APKs
        # تم تعديل المسار ليشمل مجلد SlipNet-main
        path: SlipNet-main/app/build/outputs/apk/full/debug/*.apk
