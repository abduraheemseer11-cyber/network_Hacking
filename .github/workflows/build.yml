name: Build SlipNet APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  OPENSSL_VERSION: "3.0.15"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install specific NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk --locked

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: SlipNet-main/gomobile-build/go.mod
        cache-dependency-path: SlipNet-main/gomobile-build/go.sum

    - name: Install gomobile
      run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init

    - name: Build Go mobile libraries
      working-directory: SlipNet-main/gomobile-build
      run: make build

    - name: Cache OpenSSL
      id: cache-openssl
      uses: actions/cache@v4
      with:
        path: ~/android-openssl
        key: openssl-android-${{ env.OPENSSL_VERSION }}

    - name: Build OpenSSL for Android
      if: steps.cache-openssl.outputs.cache-hit != 'true'
      run: |
        chmod +x SlipNet-main/app/scripts/build-openssl-android.sh
        OUTPUT_DIR=$HOME/android-openssl/android-ssl \
        OPENSSL_VERSION=${{ env.OPENSSL_VERSION }} \
        SlipNet-main/app/scripts/build-openssl-android.sh

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-disabled: true

    - name: Build Debug APK
      working-directory: SlipNet-main
      run: |
        chmod +x gradlew
        ./gradlew assembleFullDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SlipNet-Debug-APK
        path: SlipNet-main/app/build/outputs/apk/full/debug/*.apk
